name: 刷课
 
on: 
  push:
    branches: [ main ]
  workflow_dispatch: # 允许在 Actions 页面手动点 Run workflow 触发
  #是否开始每天8点定时刷课，若要开启请把下面两行注释去掉
  #schedule:
  #  - cron: "0 8 * * *" 
    
jobs: 
  Start:
    runs-on: ubuntu-latest # 在最新版本的 Ubuntu 操作系统环境下运行
    steps: # 要执行的步骤
      - name: 拷贝代码
        uses: actions/checkout@v4  # 用于将github代码仓库的代码拷贝到工作目录中
 
      - name: 设置python环境
        uses: actions/setup-python@v5 # 用于设置 Python 环境，它允许你指定要在工作环境中使用的 Python 版本
        with:
          python-version: '3.13'  # 选择要用的Python版本
 
      - name: 安装依赖包
        run: | # 安装依赖包
          pip install -r ./requirements.txt 
          
      
      - name: 生成 config.ini
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
          AI_KEY: ${{ secrets.AI_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          cp config_template.ini config.ini
          python - <<'EOF'
          import configparser, os
          p = 'config.ini'
          c = configparser.ConfigParser()
          c.read(p, encoding='utf8')
          c.set('common', 'username', os.environ.get('CHAOXING_USERNAME', ''))
          c.set('common', 'password', os.environ.get('CHAOXING_PASSWORD', ''))
          c.set('common', 'course_list', os.environ.get('CHAOXING_COURSE_LIST', ''))
          c.set('tiku', 'provider', 'AI')
          c.set('tiku', 'endpoint', os.environ.get('AI_ENDPOINT', 'https://apihub.agnes-ai.com/v1'))
          c.set('tiku', 'key', os.environ.get('AI_KEY', ''))
          c.set('tiku', 'model', os.environ.get('AI_MODEL', 'agnes-3.0-flash'))
          c.set('tiku', 'thinking_enabled', 'true')
          c.set('tiku', 'max_tokens', '8192')
          c.set('tiku', 'submit', 'false')
          with open(p, 'w', encoding='utf8') as f:
              c.write(f)
          EOF

      - name: Run main.py
        run: python main.py -c config.ini
